name: youtube-uploader 테스트

on:
  pull_request:
    paths:
      - "youtube-uploader/**"
      - ".github/workflows/youtube-uploader-tests.yml"
  push:
    branches: [main]
    paths:
      - "youtube-uploader/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-uploader/requirements.txt
      - run: pip install -r youtube-uploader/requirements.txt pytest
      - run: python -m pytest -q youtube-uploader/tests
